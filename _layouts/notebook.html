<!doctype html>
<html lang="{{ page.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071a2b">
    <title>{{ page.title | escape }} · {{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: page.summary | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <meta property="og:title" content="{{ page.title | escape }} · {{ site.title | escape }}">
    <meta property="og:description" content="{{ page.description | default: page.summary | default: site.description | escape }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/img/og.png' | absolute_url }}">
    <meta property="og:type" content="{% if page.layout == 'note' %}article{% else %}website{% endif %}">
    <link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/homepage.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/notebook.css' | relative_url }}">
    {% if page.layout == 'notebook-index' %}<script src="{{ '/assets/js/notebook.js' | relative_url }}" defer></script>{% endif %}
  </head>
  <body id="top">
    <a class="skip-link" href="#main">跳转到内容</a>
    <header class="site-header">
      <nav class="nav shell" aria-label="Main navigation">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark" aria-hidden="true"><img src="{{ '/assets/img/brand-icon.png' | relative_url }}" alt="" width="26" height="26"></span>
          <span>Yuedong Zhong</span>
        </a>
        <div class="nav-links">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/#publications' | relative_url }}">Publications</a>
          <a href="{{ '/digest/' | relative_url }}" {% if page.notebook == 'digest' %}aria-current="{% if page.layout == 'note' %}true{% else %}page{% endif %}"{% endif %}>Paper Digest</a>
          <a href="{{ '/tech/' | relative_url }}" {% if page.notebook == 'tech' %}aria-current="{% if page.layout == 'note' %}true{% else %}page{% endif %}"{% endif %}>Tech Notes</a>
        </div>
        <a class="nav-cta" href="https://github.com/Adeshen" target="_blank" rel="noreferrer">GitHub ↗</a>
      </nav>
    </header>
    <main id="main" class="shell notebook-main">{{ content }}</main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p><strong>Yuedong Zhong</strong><br><span>Reading · Building · Thinking</span></p>
        <p>记录读过的论文、实践中的问题，以及尚待验证的想法。</p>
        <a href="#top">Back to top ↑</a>
      </div>
    </footer>
  </body>
</html>
