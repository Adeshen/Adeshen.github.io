layout: compress

<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, follow">
    <meta http-equiv="refresh" content="0; url={{ '/' | relative_url }}">
    <link rel="canonical" href="{{ '/' | absolute_url }}">
    <title>Redirecting to Yuedong Zhong</title>
    <script>window.location.replace({{ '/' | relative_url | jsonify }});</script>
  </head>
  <body>
    <p>This page has moved to <a href="{{ '/' | relative_url }}">Yuedong Zhong's homepage</a>.</p>
  </body>
</html>
